<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>投稿サイト</title>

  <style>
   
    body { font-family: sans-serif; margin: 20px; }
    .post-list { background: #d9f0d0; padding: 10px; margin-top: 20px; width: 800px; }
    .post { border-bottom: 1px solid #ccc; padding: 10px 0; }
    .buttons button { margin-right: 5px; }
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 5px; min-width: 400px;
    }
  </style>
</head>
<body>
  <h1>投稿サイト</h1>
  <div>
    <h3>新規投稿</h3>
    <label>タイトル</label><br>
    <input type="text" id="titleInput"><br><br>
    <label>内容</label><br>
    <textarea id="contentInput"></textarea><br><br>
    <button id="submitBtn">投稿</button>
  </div>

  
  <div class="post-list" id="postList">
    <h3>投稿済みの記事一覧</h3>
  </div>

 
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>投稿編集</h3>
      <label>タイトル</label><br>
      <input type="text" id="editTitle"><br><br>
      <label>内容</label><br>
      <textarea id="editContent"></textarea><br><br>
      <button id="updateBtn">更新</button>
      <button id="cancelEditBtn">キャンセル</button>
    </div>
  </div>


  <div class="modal" id="deleteModal">
    <div class="modal-content">
      <h3>削除確認</h3>
      <p id="deleteInfo"></p>
      <button id="confirmDeleteBtn">OK</button>
      <button id="cancelDeleteBtn">キャンセル</button>
    </div>
  </div>

  <script src="general_02.js"></script>
</body>
</html>
